name: Force Break

on:
  push:
    branches: [master]
    paths: ['force-break/**', '.github/workflows/force-break.yml', '.github/workflows/publish-build.yml', '.github/release/**']
  pull_request:
    paths: ['force-break/**', '.github/workflows/force-break.yml', '.github/workflows/publish-build.yml', '.github/release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/release -p 'test_*.py' -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release/release.py plan force-break
  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: force-break
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build single EXE without runtime
        run: ./build.ps1 -Runtime win-x64
      - name: Stage the requested download filename
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item out/ForceBreak-win-x64/ForceBreak.exe out/release/force-break-win-x64.exe
      - name: GUI launch and native installation lifecycle
        run: dotnet run --project tests/ForceBreak.Integration.Tests -c Release -- "$PWD/out/release/force-break-win-x64.exe"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate build JSON
        run: |
          python ../.github/release/release.py info force-break out/release
          if ($LASTEXITCODE -ne 0) { throw 'Build metadata failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-force-break
          path: force-break/out/release/*
          if-no-files-found: error
  publish:
    needs: windows
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-build.yml
    with:
      project: force-break
      artifact: release-force-break
