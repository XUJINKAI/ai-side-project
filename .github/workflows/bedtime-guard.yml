name: Bedtime Guard

on:
  push:
    paths: ['bedtime-guard/**', '.github/workflows/bedtime-guard.yml']
  pull_request:
    paths: ['bedtime-guard/**', '.github/workflows/bedtime-guard.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: bedtime-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build single EXE without runtime
        run: ./build.ps1 -Runtime win-x64
      - name: GUI launch and native installation lifecycle
        run: dotnet run --project tests/BedtimeGuard.Integration.Tests -c Release -- "$PWD/out/BedtimeGuard-win-x64/BedtimeGuard.exe"
      - name: Checksum
        run: |
          $hash = Get-FileHash out/BedtimeGuard-win-x64/BedtimeGuard.exe -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  BedtimeGuard.exe" | Set-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BedtimeGuard-win-x64-single-exe
          path: |
            bedtime-guard/out/BedtimeGuard-win-x64/BedtimeGuard.exe
            bedtime-guard/out/SHA256SUMS.txt
          if-no-files-found: error
