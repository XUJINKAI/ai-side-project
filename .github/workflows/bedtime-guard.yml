name: Bedtime Guard

on:
  push:
    paths: ['bedtime-guard/**', '.github/workflows/bedtime-guard.yml']
  pull_request:
    paths: ['bedtime-guard/**', '.github/workflows/bedtime-guard.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: bedtime-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Test and build x64 bundle
        run: ./build.ps1 -Runtime win-x64
      - name: Install, service IPC, repair, resume and uninstall
        shell: powershell
        run: ./scripts/Smoke-Test.ps1 -Bundle "$PWD/out/BedtimeGuard-win-x64"
      - name: Checksum
        run: |
          $hash = Get-FileHash out/BedtimeGuard-win-x64.zip -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  BedtimeGuard-win-x64.zip" | Set-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BedtimeGuard-win-x64
          path: |
            bedtime-guard/out/BedtimeGuard-win-x64.zip
            bedtime-guard/out/SHA256SUMS.txt
          if-no-files-found: error
