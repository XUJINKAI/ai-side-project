<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · LanSend</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>LanSend <small>局域箱</small></h1>
    <p>请输入访问令牌以继续。</p>
    <form action="/enter" method="post">
      <input id="next" name="next" type="hidden" value="/">
      <label for="token">访问令牌</label>
      <input id="token" name="token" type="password" required autofocus autocomplete="current-password">
      <p id="login-error" class="error" hidden>访问令牌无效，请重试。</p>
      <button type="submit">进入 LanSend</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
